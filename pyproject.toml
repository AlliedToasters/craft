[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["craft*"]

[project]
name = "craft"
version = "0.0.0"
description = "Mysterious project without specification."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Michael Klear"}]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "anthropic>=0.40",
    "requests>=2.31.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# Unit tests live under tests/. E2E integration tests live under e2e/ —
# they require a live MC client + homunculus and are orchestrated by
# run_tests.py as subprocesses (`python -m e2e.<name>`), not pytest.
# Excluding e2e/ keeps `pytest` fast and offline-safe.
testpaths = ["tests"]
